name: probe-token

# Throwaway: attempts the real thing — pushing a branch to
# adlawson/homebrew-tap and opening a PR there, using GITHUB_TOKEN via the gh
# CLI. Delete once the answer is recorded.
on: workflow_dispatch

permissions:
  contents: read
  pull-requests: write # note: only ever applies to *this* repo

jobs:
  probe:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAP: adlawson/homebrew-tap
    steps:
      - name: Try to open a PR on the tap with GITHUB_TOKEN
        run: |
          set +e
          git config --global user.name "adlawson"
          git config --global user.email "adlawson@gmail.com"

          echo "===== token identity ====="
          gh api user --jq '.login' 2>&1 | tail -2

          echo "===== clone the tap ====="
          git clone --quiet "https://x-access-token:${GH_TOKEN}@github.com/${TAP}.git" tap 2>&1 | tail -3
          echo "clone exit=$?"
          cd tap || exit 1

          branch="probe-github-token-${GITHUB_RUN_ID}"
          git checkout -q -b "$branch"
          printf '# probe\n\nThrowaway file from a GITHUB_TOKEN access probe. Safe to delete.\n' >PROBE.md
          git add PROBE.md
          git commit -q -m "probe: can GITHUB_TOKEN push to this repo?"

          echo "===== git push the branch to the tap ====="
          git push origin "$branch" 2>&1 | tail -5
          push=${PIPESTATUS[0]}
          echo "push exit=$push"

          echo "===== gh pr create against the tap ====="
          gh pr create --repo "$TAP" --base main --head "$branch" \
            --title "probe: GITHUB_TOKEN cross-repo PR" \
            --body "Throwaway probe to establish whether GITHUB_TOKEN can open a PR across repositories. Safe to close and delete the branch." 2>&1 | tail -5
          echo "pr create exit=${PIPESTATUS[0]}"

          echo "===== summary ====="
          if [ "$push" -eq 0 ]; then
            echo "PUSH SUCCEEDED — GITHUB_TOKEN can write to $TAP"
          else
            echo "PUSH FAILED — GITHUB_TOKEN cannot write to $TAP"
          fi
