name: build-and-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v (e.g. 20260728 or 20260728-rc1)"
        required: true

jobs:
  # Produces the artifacts and nothing else, so a workflow_dispatch run is a
  # complete dry run: it builds and generates the cask without releasing.
  build:
    runs-on: macos-26 # matches the Swift 6.2 toolchain the app is developed against
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version#v}" >>"$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build release artifact
        run: ./script/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Generate cask
        run: |
          ./script/build-brew-cask.sh \
            --version "${{ steps.version.outputs.version }}" \
            --zip ".release/Legenda-v${{ steps.version.outputs.version }}.zip"

      - name: Upload app
        uses: actions/upload-artifact@v7
        with:
          name: legenda-app
          path: .release/Legenda-v${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      # Both the rolling cask and the pinned one, so a failed PR step can still be
      # completed by hand. Listed explicitly rather than globbed: .release is a
      # hidden directory, and upload-artifact drops hidden paths from glob results.
      - name: Upload casks
        uses: actions/upload-artifact@v7
        with:
          name: legenda-cask
          path: |
            .release/legenda.rb
            .release/legenda@${{ steps.version.outputs.version }}.rb
          if-no-files-found: error

  # Only on a tag. Publishing needs no macOS, so this runs on Linux.
  release:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
      TAP: adlawson/homebrew-tap
    steps:
      - name: Download app
        uses: actions/download-artifact@v8
        with:
          name: legenda-app
          path: dist

      - name: Download cask
        uses: actions/download-artifact@v8
        with:
          name: legenda-cask
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --title "v$VERSION" \
            --generate-notes \
            "dist/Legenda-v$VERSION.zip"

      # Cross-repo, which the default GITHUB_TOKEN cannot do: it is an
      # installation token scoped to this repository, so pushing to the tap is
      # denied to github-actions[bot]. Needs a PAT in HOMEBREW_TAP_TOKEN with
      # Contents: write (branch + file) and Pull requests: write on the tap.
      #
      # Committing over the API rather than with git deliberately: there is no
      # working copy to clone and no committer identity to configure, and GitHub
      # attributes the commit to whoever owns the token.
      - name: Open cask PR against the tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning title=Cask PR skipped::HOMEBREW_TAP_TOKEN is not set, so no PR was opened against $TAP. Add a PAT with Contents and Pull requests write on $TAP as the HOMEBREW_TAP_TOKEN secret, then copy the legenda-cask artifact into Casks/ by hand for this release."
            exit 0
          fi

          branch="legenda-$VERSION"
          base_sha="$(gh api "repos/$TAP/git/ref/heads/main" --jq '.object.sha')"

          # Create the branch, or reset it if an earlier run left one behind.
          gh api -X POST "repos/$TAP/git/refs" \
            -f "ref=refs/heads/$branch" -f "sha=$base_sha" >/dev/null 2>&1 \
            || gh api -X PATCH "repos/$TAP/git/refs/heads/$branch" \
                 -f "sha=$base_sha" -F force=true >/dev/null

          # Commit one file to the branch. Returns 1 without committing when the
          # content is already identical, so the caller can tell whether the PR has
          # anything in it.
          #
          # Reads the existing blob against the *branch*, not main: the second call
          # has to see what the first one committed.
          commit_file() {
            local path="$1" source="$2" message="$3"
            local wanted current_json current_sha current_b64

            wanted="$(base64 -w0 <"$source")"
            current_json="$(gh api "repos/$TAP/contents/$path?ref=$branch" 2>/dev/null || echo '{}')"
            current_sha="$(jq -r '.sha // empty' <<<"$current_json")"
            # GitHub wraps the base64 payload; base64 -w0 does not.
            current_b64="$(jq -r '.content // empty' <<<"$current_json" | tr -d '\n')"

            if [ -n "$current_b64" ] && [ "$current_b64" = "$wanted" ]; then
              echo "::notice::$path is already identical; left alone."
              return 1
            fi

            local args=(-X PUT "repos/$TAP/contents/$path"
                        -f "message=$message"
                        -f "content=$wanted"
                        -f "branch=$branch")
            if [ -n "$current_sha" ]; then args+=(-f "sha=$current_sha"); fi

            local commit
            commit="$(gh api "${args[@]}" --jq '.commit.sha')"
            echo "::notice::Committed $path as $commit"
            return 0
          }

          # The rolling cask moves to this version; the pinned one is added as a
          # permanent record that can be installed directly.
          changed=0
          commit_file "Casks/legenda.rb" "dist/legenda.rb" "legenda $VERSION" && changed=1
          commit_file "Casks/legenda@$VERSION.rb" "dist/legenda@$VERSION.rb" \
            "legenda@$VERSION $VERSION" && changed=1

          if [ "$changed" -eq 0 ]; then
            echo "::notice::Both casks are already at $VERSION; no PR needed."
            gh api -X DELETE "repos/$TAP/git/refs/heads/$branch" >/dev/null 2>&1 || true
            exit 0
          fi

          open_pr="$(gh pr list --repo "$TAP" --head "$branch" --state open --json url --jq '.[0].url // ""')"
          if [ -n "$open_pr" ]; then
            echo "::notice::Updated the existing PR $open_pr"
            exit 0
          fi

          # A file rather than an inline --body: indented continuation lines would
          # be read as markdown code blocks.
          cat >body.md <<EOF
          Released by [\`build-and-release\`](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) from \`$GITHUB_REPOSITORY\` at \`v$VERSION\`.

          The \`sha256\` is that of the zip attached to [that release](https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION).

          Label this \`pr-pull\` to merge it via the tap's \`brew pr-pull\` workflow.
          EOF

          url="$(gh pr create --repo "$TAP" --base main --head "$branch" \
            --title "Release: Legenda@v$VERSION" \
            --body-file body.md)"
          echo "::notice::Opened $url"
